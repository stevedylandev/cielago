[package]
name = "cielago"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/stevedylandev/cielago"
description = "API Client TUI in Rust"
homepage = "https://github.com/stevedylandev/cielago"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.28.1"
dirs = "6.0.0"
ratatui = "0.29.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "form",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9.34"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tui-textarea = "0.7.0"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
tap = "stevedylandev/homebrew-tap"

[package]
name = "cielago"
version = "0.2.0"
edition = "2024"
authors = ["Steve Simkins <stevedsimkins@gmail.com>"]
description = "Like Postman but actually works"
repository = "https://github.com/stevedylandev/cielago"
homepage = "https://github.com/stevedylandev/cielago"
license = "MIT"
readme = "README.md"
keywords = ["tui", "api", "http", "client", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/dist-workspace.toml", "/cliff.toml"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
inquire = "0.9.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "form",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9.34"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
tap = "stevedylandev/homebrew-tap"
